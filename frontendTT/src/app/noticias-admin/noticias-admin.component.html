<div class="form-container">
  <h2>Crear Noticia</h2>

  <form [formGroup]="noticiaForm" (ngSubmit)="crearNoticia()" class="form-news">
    <div class="form-group">
      <label for="titulo">Título</label>
      <input id="titulo" type="text" formControlName="titulo" class="form-control" placeholder="Título de la noticia" />
    </div>

    <div class="form-group">
      <label for="contenido">Contenido</label>
      <textarea id="contenido" formControlName="contenido" class="form-control" placeholder="Escribe el contenido..."></textarea>
    </div>

    <div class="form-group">
      <label for="fecha">Fecha</label>
      <input id="fecha" type="date" formControlName="fecha" class="form-control" />
    </div>

    <button type="submit" class="btn-news" [disabled]="noticiaForm.invalid">Publicar</button>
  </form>
</div>
